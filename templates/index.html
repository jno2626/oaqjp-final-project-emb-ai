<label for="textToAnalyze">Enter your text:</label>
<input type="text" id="textToAnalyze" placeholder="Type a sentence">

<button onclick="analyzeEmotion()">Analyze</button>

<p id="response"></p>

<script>
    async function analyzeEmotion() {
        const text = document.getElementById("textToAnalyze").value;
        const responseElement = document.getElementById("response");

        try {
            const result = await fetch(
                "/emotionDetector?textToAnalyze=" + encodeURIComponent(text)
            );
            const data = await result.text();
            responseElement.innerText = data;
        } catch (error) {
            responseElement.innerText = "Unable to analyze emotion.";
        }
    }
</script>
